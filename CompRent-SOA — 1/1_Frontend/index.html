<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>CompRent | SOA 5.0</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f4f6fa; color: #1a2c3e; }
        .navbar { background: white; padding: 14px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e9edf2; }
        .logo-text { font-size: 24px; font-weight: 700; color: #1f6392; }
        .container { max-width: 1200px; margin: 0 auto; padding: 28px 32px; }
        .auth-card { background: white; padding: 40px; border-radius: 24px; max-width: 450px; margin: 60px auto; }
        .auth-card h1 { text-align: center; margin-bottom: 24px; color: #1f6392; }
        .auth-input { width: 100%; padding: 12px 16px; border-radius: 24px; border: 1px solid #dce3ec; margin-bottom: 14px; font-size: 15px; }
        .auth-btn { width: 100%; background: #1f6392; color: white; border: none; border-radius: 24px; padding: 12px; font-weight: 600; cursor: pointer; font-size: 15px; }
        .auth-btn:hover { background: #0f4a6e; }
        .error-msg { color: #c2412c; text-align: center; margin-top: 12px; font-size: 14px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .product-card { background: white; padding: 20px; border-radius: 20px; border: 1px solid #eef2f8; transition: 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        .product-name { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
        .product-brand { font-size: 13px; color: #5b6e8c; margin-bottom: 12px; }
        .product-price { font-size: 20px; font-weight: 700; color: #1f6392; margin: 12px 0; }
        .rent-btn { width: 100%; background: #1f6392; color: white; border: none; border-radius: 24px; padding: 10px; font-weight: 600; cursor: pointer; }
        .rent-btn:hover { background: #0f4a6e; }
        .logout-btn { background: none; border: none; color: #c2412c; font-weight: 500; cursor: pointer; }
        .user-info { display: flex; gap: 16px; align-items: center; }
    </style>
</head>
<body>
<div id="app"></div>
<script>
    const ESB_URL = 'http://localhost:3000';
    const LAPTOPS = [
        { id: 1, name: "Acer Nitro V 16 AI", brand: "Acer", price: 374, specs: "16″ IPS 180Hz · R5 · 16GB · RTX4050" },
        { id: 2, name: "Apple MacBook Neo 2026", brand: "Apple", price: 291, specs: "13″ Retina · A18 Pro · 8GB · 512GB" },
        { id: 3, name: "Lenovo IdeaPad Slim 5", brand: "Lenovo", price: 291, specs: "16″ IPS · R7 · 32GB · 512GB" },
        { id: 4, name: "Apple MacBook Air 2026", brand: "Apple", price: 541, specs: "15.3″ Retina · M5 · 16GB · 512GB" },
        { id: 5, name: "Asus Vivobook 15", brand: "Asus", price: 208, specs: "15.6″ IPS · Core 5 · 16GB · 512GB" },
        { id: 6, name: "Dell XPS 15", brand: "Dell", price: 489, specs: "15.6″ OLED · i7 · 32GB · RTX4060" },
        { id: 7, name: "HP Spectre x360", brand: "HP", price: 399, specs: "14″ OLED · i7 · 16GB · 1TB" }
    ];
    let authToken = null;
    let currentUser = null;

    function render() {
        const root = document.getElementById('app');
        if (!authToken) renderLogin(root);
        else renderShop(root);
    }

    function renderLogin(root) {
        root.innerHTML = `
            <div class="auth-card">
                <h1>🔐 CompRent — Zaloguj się</h1>
                <input type="email" id="loginEmail" class="auth-input" placeholder="Email" value="admin@comprent.pl">
                <input type="password" id="loginPassword" class="auth-input" placeholder="Hasło" value="admin123">
                <button id="doLogin" class="auth-btn">Zaloguj się</button>
                <div id="loginError" class="error-msg"></div>
            </div>
        `;
        document.getElementById('doLogin').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            try {
                const res = await fetch(`${ESB_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    authToken = data.token;
                    currentUser = data.user;
                    render();
                } else {
                    document.getElementById('loginError').innerText = (data.error || "Błędne dane");
                }
            } catch (err) {
                document.getElementById('loginError').innerText = "Brak połączenia z ESB (port 3000)";
            }
        });
    }

    function renderShop(root) {
        root.innerHTML = `
            <div class="navbar">
                <div class="logo-text">CompRent</div>
                <div class="user-info">
                    <span> ${currentUser.name} ${currentUser.surname}</span>
                    <button class="logout-btn" id="logoutBtn">Wyloguj</button>
                </div>
            </div>
            <div class="container">
                <h2>Katalog laptopów</h2>
                <div class="products-grid" id="grid"></div>
            </div>
        `;
        document.getElementById('logoutBtn').addEventListener('click', () => {
            authToken = null;
            currentUser = null;
            render();
        });
        const grid = document.getElementById('grid');
        grid.innerHTML = LAPTOPS.map(p => `
            <div class="product-card">
                <div class="product-name">${p.name}</div>
                <div class="product-brand">Marka: ${p.brand}</div>
                <div style="font-size:13px;color:#5b6e8c;">${p.specs}</div>
                <div class="product-price">${p.price} zł / mies.</div>
                <button class="rent-btn" data-id="${p.id}">Wypożycz</button>
            </div>
        `).join('');
        grid.querySelectorAll('.rent-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const product = LAPTOPS.find(l => l.id == btn.dataset.id);
                try {
                    const res = await fetch(`${ESB_URL}/api/rent`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${authToken}`
                        },
                        body: JSON.stringify({
                            productName: product.name,
                            brand: product.brand,
                            price: product.price,
                            userId: currentUser.id
                        })
                    });
                    if (res.status === 202) {
                        alert(`Zamówienie na "${product.name}" przyjęte!\nKolejka: ${product.brand === 'Apple' ? 'apple_queue' : 'windows_queue'}`);
                    } else {
                        alert('Błąd: ' + res.status);
                    }
                } catch (err) {
                    alert('Brak połączenia z ESB');
                }
            });
        });
    }
    render();
</script>
</body>
</html>
